name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPORT_DIR: .cache/browser-reports
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install locked dependencies and patches
        run: pnpm install --frozen-lockfile
      - name: Unit and regression tests
        run: pnpm test
      - name: Type check
        run: pnpm typecheck
      - name: Build verified static site and third-party notices
        run: pnpm build
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Chromium matching, OCR and interactions
        run: pnpm test:e2e
        env:
          BROWSER: chromium
      - name: WebKit matching and OCR
        run: pnpm test:e2e
        env:
          BROWSER: webkit
      - name: OCR on the Nuxt development server
        run: pnpm test:ocr:dev
        env:
          BROWSER: chromium
          REPORT_DIR: .cache/browser-reports/dev
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-reports
          path: .cache/browser-reports/
          if-no-files-found: ignore
          retention-days: 7
