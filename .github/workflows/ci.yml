name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPORT_DIR: .cache/browser-reports
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - name: Install locked dependencies and patches
        run: pnpm install --frozen-lockfile
      - name: Unit and regression tests
        run: pnpm test
      - name: Type check
        run: pnpm typecheck
      - name: Build verified static site and third-party notices
        run: pnpm build
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Chromium matching, OCR and interactions
        run: pnpm test:e2e
        env:
          BROWSER: chromium
      - name: WebKit matching and OCR
        run: pnpm test:e2e
        env:
          BROWSER: webkit
      - name: OCR on the Nuxt development server
        run: pnpm test:ocr:dev
        env:
          BROWSER: chromium
          REPORT_DIR: .cache/browser-reports/dev
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .output/public
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-reports
          path: .cache/browser-reports/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
